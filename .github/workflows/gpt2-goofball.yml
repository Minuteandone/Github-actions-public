name: GPT-2 Goofball 🤡

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Number of weight-training steps
        type: choice
        required: true
        default: "200"
        options:
          - "100"
          - "160"
          - "200"
          - "400"
          - "800"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpt2-goofball.yml"
      - "gpt2-goofball/**"

permissions:
  contents: read

concurrency:
  group: gpt2-goofball-${{ github.ref }}
  cancel-in-progress: false

jobs:
  teach:
    name: Teach GPT-2 terrible logic, preserve grammar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Check out experiment code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install model dependencies
        run: python -m pip install -r gpt2-blender/requirements.txt
      - name: Fine-tune GPT-2 on bad but coherent reasoning
        run: |
          python -u gpt2-goofball/experiment.py \
            --steps "${{ inputs.steps || '200' }}" \
            --output-dir gpt2-goofball/results
      - name: Publish side-by-side samples to summary
        if: always()
        shell: bash
        run: |
          if [ -f gpt2-goofball/results/report.md ]; then
            cat gpt2-goofball/results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No finished report: inspect the training logs for errors." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report and trained layer weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-goofball-model-and-results
          path: gpt2-goofball/results/
          if-no-files-found: warn
          retention-days: 30
