name: GPT-2 Blender 🌀

on:
  workflow_dispatch:
    inputs:
      intensity:
        description: How badly should we scramble GPT-2?
        type: choice
        required: true
        default: medium
        options:
          - mild
          - medium
          - extreme
  push:
    branches: [main]
    paths:
      - ".github/workflows/gpt2-blender.yml"
      - "gpt2-blender/**"

permissions:
  contents: read

concurrency:
  group: gpt2-blender-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutate:
    name: Corrupt a GPT-2 on CPU and record what happens
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Check out experiment code
        uses: actions/checkout@v4
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install model dependencies
        run: python -m pip install -r gpt2-blender/requirements.txt
      - name: Actually corrupt GPT-2
        run: |
          python -u gpt2-blender/experiment.py \
            --intensity "${{ inputs.intensity || 'medium' }}" \
            --output-dir gpt2-blender/results
      - name: Display experiment in job summary
        if: always()
        shell: bash
        run: |
          if [ -f gpt2-blender/results/report.md ]; then
            cat gpt2-blender/results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No GPT-2 results were created; inspect the preceding step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save generated texts and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-blender-results
          path: gpt2-blender/results/
          if-no-files-found: warn
          retention-days: 30
